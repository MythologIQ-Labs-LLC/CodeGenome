[package]
name = "codegenome-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLI for the Unified Code Reality Graph"

[[bin]]
name = "codegenome"
path = "src/main.rs"

[dependencies]
codegenome-identity = { path = "../codegenome-identity" }
codegenome-substrate = { path = "../codegenome-substrate" }
codegenome-mcp = { path = "../codegenome-mcp" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
